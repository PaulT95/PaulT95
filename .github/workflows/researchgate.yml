name: Latest ResearchGate Publications
on:
  schedule:
    # Runs every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-publications:
    name: Update README with ResearchGate papers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://www.researchgate.net/publicfeed.RSS?type=publication&id=Paolo-Tecchio"
          comment_tag_name: "RESEARCHGATE"
          # This template makes it look professional for academics
          template: "- [$title]($url) - $date"
          max_post_count: 5
